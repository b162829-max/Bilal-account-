
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DriverAccounts_DesignB_Project-1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f DriverAccounts_DesignB_Project-1.zip

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q DriverAccounts_DesignB_Project-1.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverAccounts-APK
          path: project/**/build/outputs/apk/debug/*.apk
