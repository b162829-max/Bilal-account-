
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle wrapper
        run: |
          GRADLE_FILE=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found"
            find project -maxdepth 4 -type f
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
