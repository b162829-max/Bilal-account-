
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP_FILE" -d project

      

      - name: Locate Gradle Wrapper
        run: |
          echo "Searching for Gradle Wrapper..."
          GRADLE_FILE=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 6 -type f
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Gradle folder: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

          echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
